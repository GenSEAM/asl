# GitLab Pages CI/CD Configuration for ASL (AgentScript Language)
image: ubuntu:24.04

pages:
  stage: deploy
  script:
    - apt-get update && apt-get install -y --no-install-recommends clang llvm lld make ca-certificates
    - sh web/build.sh
    - rm -rf public
    - cp -r web/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ASL Agent Studio</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #090a0f;
      color: #f1f3f7;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e2230;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .badge {
      background: #141724;
      border: 1px solid #2e364f;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
    button {
      width: 100%;
      background: #38bdf8;
      color: #090a0f;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #7dd3fc;
    }
    .output {
      background: #040508;
      border: 1px solid #1e2230;
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 11px;
      color: #4ade80;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong style="color: #f8fafc;">ASL Agent Plugin</strong>
    <span class="badge">WASI Sandbox</span>
  </div>
  <p style="color: #94a3b8; margin: 0 0 10px 0;">Extract DOM & execute agent tools in browser memory:</p>
  <button id="btn-extract">Extract DOM to S-Expression</button>
  <button id="btn-eval" style="background: #1e2230; color: #38bdf8; border: 1px solid #2e364f;">Run In-Memory Wasm Benchmark</button>
  <div id="output" class="output">Ready. Click a button to execute.</div>
  <script src="../dist/popup.js"></script>
</body>
</html>
